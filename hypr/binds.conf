$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = walker

# Essentials

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
#bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, B, togglesplit,

# Move focus (h‑j‑k‑l style)

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, u
bind = $mainMod, k, movefocus, d

# Resize (arrow keys)

bind = $mainMod, right, resizeactive, 10 0
bind = $mainMod, left,  resizeactive, -10 0
bind = $mainMod, up,    resizeactive, 0 -10
bind = $mainMod, down,  resizeactive, 0 10

# Swap windows

bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, j, swapwindow, u
bind = $mainMod SHIFT, k, swapwindow, d

# Focus

bindl = $mainMod,mouse_down, workspace, e+1
bindl = $mainMod,mouse_up,   workspace, e-1

# Switch workspaces with mainMod + [0-9]

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Workspaces and Monitors

bind = $mainMod SHIFT, K, swapactiveworkspaces, eDP-1 DP-2
bind = $mainMod SHIFT, T, movecurrentworkspacetomonitor, eDP-1
bind = $mainMod SHIFT, Y, movecurrentworkspacetomonitor, DP-2
#bind = $mainMod SHIFT, Y, movecurrentworkspacetomonitor, HDMI-A-1

# Move/resize windows with mainMod + LMB/RMB and dragging

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# List of things copied by cliphist on wofi

bind = SUPER, SPACE, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Toggle fullscreen modes

bind = $mainMod, Z, fullscreen, 1    # client side
bind = $mainMod, F, fullscreen, 2    # full = borderless+tile

# Binds for screen capture Hyprshot

# Screenshot a window

bind = $mainMod, code:156, exec, hyprshot -m window

# Screenshot a monitor

bind = , code:156, exec, hyprshot -m output

# Screenshot a region

bind = $mainMod SHIFT, code:156, exec, hyprshot -m region

# Screenshot a window

bind = $mainMod, PRINT, exec, hyprshot -m window

# Screenshot a monitor

bind = , PRINT, exec, hyprshot -m output

# Screenshot a region

bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region

# Media bindings

bind = $mainMod, F1, exec, playerctl play-pause
bind = $mainMod, F2, exec, playerctl stop
bind = $mainMod, F3, exec, playerctl previous
bind = $mainMod, F4, exec, playerctl next

# Audio control

bind = , code:122, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , code:123, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , code:121, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Screen backlight

bind = , code:232, exec, brightnessctl --device=amdgpu_bl1 s 5%-
bind = , code:233, exec, brightnessctl --device=amdgpu_bl1 s +5%

# Add new workspace

bind = $mainMod, N, workspace, r+1 
bind = $mainMod, P, workspace, r-1 

# Lid switch

bind = , switch\:Lid Switch, exec, systemctl suspend
