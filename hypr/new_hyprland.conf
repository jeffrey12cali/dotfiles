# \~/.config/hypr/hyprland.conf

# Optimised for ROG Zephyrus G14 GA403UI  (Ryzen 9 8945HS + RTX 4070)

# Last edited: 2025‑06‑14

#

# The file is now split into logical chunks for easier maintenance.

# ─ \~/.config/hypr/monitors.conf → monitor layout & scaling

# ─ \~/.config/hypr/env.conf      → environment & GPU switching

# ─ \~/.config/hypr/windowrules.conf  → window rules

# ─ \~/.config/hypr/binds.conf        → key / mouse binds

#

# You can keep it monolithic by deleting the `source = …` lines and

# pasting the referenced snippets inline.  Either approach will work.

# ─────────────────────────────────────────────────────────────

# ------------------------------------------------------------

# Imports

# ------------------------------------------------------------

source = \~/.config/hypr/hyprsecret.conf      # passwords, tokens, etc.
source = \~/.config/hypr/monitors.conf        # ↙ see snippet below
source = \~/.config/hypr/env.conf             # ↙ see snippet below
source = \~/.config/hypr/windowrules.conf     # ↙ see snippet below
source = \~/.config/hypr/binds.conf           # ↙ see snippet below

# ------------------------------------------------------------

# Compositor‑wide defaults

# ------------------------------------------------------------

general {
gaps\_in         = 3
gaps\_out        = 10
border\_size     = 2
col.active\_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
col.inactive\_border = rgba(595959aa)
layout          = dwindle
allow\_tearing   = false
}

decoration {
rounding = 10
blur {
enabled = true
size    = 3
passes  = 1
}
}

animations {
enabled   = yes
bezier    = myBezier, 0.05, 0.9, 0.1, 1.05
animation = windows,      1, 7, myBezier
animation = windowsOut,   1, 7, default, popin 80%
animation = border,       1, 10, default
animation = borderangle,  1, 8,  default
animation = fade,         1, 7,  default
animation = workspaces,   1, 6,  default
}

dwindle {
pseudotile     = yes
preserve\_split = yes
}

render {

# 2 = try direct‑scanout, fall back if unsupported

direct\_scanout = 2
}

xwayland {
force\_zero\_scaling = true
}

input {
kb\_layout     = es
accel\_profile = flat
follow\_mouse  = 1
touchpad {
natural\_scroll = no
}
}

# ------------------------------------------------------------

# Lightweight autostart (prefer systemd‑user for daemons)

# ------------------------------------------------------------

# Long‑running background apps (waybar, nm‑applet, nextcloud, dunst,

# kbuildsycoca6, polychromatic, etc.) should be started by dedicated

# systemd‑user units so they continue to work even if Hyprland restarts.

#

# Here we keep only compositor‑dependent one‑shots.

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# ------------------------------------------------------------

# Everything else (rules, binds, etc.) lives in the sourced files.

# ------------------------------------------------------------

\###############################################################

# ---  Snippet: \~/.config/hypr/monitors.conf  ---------------

# Each monitor line: <name>,<mode>,<position>,<scale>

monitor = eDP-1, preferred, auto, 1.25          # 14”  WQHD 165 Hz
monitor = DP-2, 2560x1440\@165, auto, 1.25       # 27” 1440p 165 Hz

\###############################################################

# ---  Snippet: \~/.config/hypr/env.conf  --------------------

# GPU switching:   switch-gpu.sh → writes the desired card to this file

env = WLR\_DRM\_DEVICES,\$HOME/.config/hypr/gpu

# Common desktop vars

env = XCURSOR\_SIZE,24
env = QT\_QPA\_PLATFORMTHEME,qt6ct
env = QT\_AUTO\_SCREEN\_SCALE\_FACTOR,true
env = XDG\_DATA\_DIRS,\$XDG\_DATA\_DIRS:/var/lib/flatpak/exports/share:\$HOME/.local/share/flatpak/exports/share
env = SSH\_AUTH\_SOCK,\$XDG\_RUNTIME\_DIR/ssh-agent.socket

# NVIDIA‑only overrides are injected by /etc/profile.d/nvidia-hyprland.sh

# when the nvidia‑modules are loaded.

\###############################################################

# ---  Snippet: \~/.config/hypr/windowrules.conf -------------

# Rule helpers

windowrulev2 = float,title:(?i)picture.?in.?picture
windowrulev2 = pin,title:(?i)picture.?in.?picture
windowrulev2 = float,title:(Open|Save) File(s?)
windowrulev2 = float,class:(org.telegram.desktop|mpv|org.kde.konsole)
windowrulev2 = size 1343 899,class:(org.telegram.desktop)
windowrulev2 = idleinhibit fullscreen,class:^(.*)\$,title:^(.*)\$,fullscreen:1

# Games

windowrulev2 = tag +games,class:^(marvel-win64-shipping.exe)\$
windowrulev2 = immediate,tag\:games\*
windowrulev2 = fullscreen,tag\:games\*
windowrulev2 = allowsinput,tag\:games\*
windowrulev2 = content game,tag\:games\*

# Workspace hints

windowrulev2 = workspace 3 silent,class:^(keepassxc)\$
windowrulev2 = workspace 3 silent,class:^(org.kde.dolphin)\$

\###############################################################

# ---  Snippet: \~/.config/hypr/binds.conf  ------------------

\$mainMod = SUPER
\$terminal = kitty
\$fileManager = dolphin
\$menu = wofi --show drun

# Essentials

bind = \$mainMod, RETURN, exec, \$terminal
bind = \$mainMod|SHIFT, Q, killactive,
bind = \$mainMod, E, exec, \$fileManager
bind = \$mainMod, R, exec, \$menu

# Move focus (h‑j‑k‑l style)

bind = \$mainMod, h, movefocus, l
bind = \$mainMod, l, movefocus, r
bind = \$mainMod, j, movefocus, u
bind = \$mainMod, k, movefocus, d

# Resize (arrow keys)

bind = \$mainMod, right, resizeactive, 10 0
bind = \$mainMod, left,  resizeactive, -10 0
bind = \$mainMod, up,    resizeactive, 0 -10
bind = \$mainMod, down,  resizeactive, 0 10

# Workspaces 0‑9

# Focus

bindl = \$mainMod,mouse\_down, workspace, e+1
bindl = \$mainMod,mouse\_up,   workspace, e-1

# Move window

autobind = \$mainMod|SHIFT, 1-10, movetoworkspace, # expands automatically

# Toggle fullscreen modes

bind = \$mainMod, Z, fullscreen, 1    # client side
bind = \$mainMod, F, fullscreen, 2    # full = borderless+tile

# Screen capture via hyprshot

bind = \$mainMod, PRINT, exec, hyprshot -m window
bind = , PRINT, exec, hyprshot -m output
bind = \$mainMod|SHIFT, PRINT, exec, hyprshot -m region

# Media keys (without \$mainMod)

bind = , XF86AudioPlay,   exec, playerctl play-pause
bind = , XF86AudioPrev,   exec, playerctl previous
bind = , XF86AudioNext,   exec, playerctl next
bind = , XF86AudioStop,   exec, playerctl stop

# Volume

bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT\_SINK@ -5%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT\_SINK@ +5%
bind = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT\_SINK@ toggle

# Brightness (AMD backlight)

bind = , XF86MonBrightnessDown, exec, brightnessctl --device=amdgpu\_bl1 set 5%-
bind = , XF86MonBrightnessUp,   exec, brightnessctl --device=amdgpu\_bl1 set +5%

# Lid‑switch → suspend

autobind = , switch\:Lid Switch, exec, systemctl suspend

\###############################################################

# End of file ------------------------------------------------

