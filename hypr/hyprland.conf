# ~/.config/hypr/hyprland.conf

# Optimised for ROG Zephyrus G14 GA403UI  (Ryzen 9 8945HS + RTX 4070)

# Last edited: 2025‑06‑14

#

# The file is now split into logical chunks for easier maintenance.

# ─ ~/.config/hypr/monitors.conf → monitor layout & scaling

# ─ ~/.config/hypr/env.conf      → environment & GPU switching

# ─ ~/.config/hypr/windowrules.conf  → window rules

# ─ ~/.config/hypr/binds.conf        → key / mouse binds

#

# ------------------------------------------------------------

# Imports

# ------------------------------------------------------------

source = ~/.config/hypr/hyprsecret.conf      # passwords, tokens, etc.
source = ~/.config/hypr/monitors.conf        # ↙ see snippet below
source = ~/.config/hypr/env.conf             # ↙ see snippet below
source = ~/.config/hypr/windowrules.conf     # ↙ see snippet below
source = ~/.config/hypr/binds.conf           # ↙ see snippet below

# ------------------------------------------------------------

# Compositor‑wide defaults

# ------------------------------------------------------------

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows,      1, 7, myBezier
    animation = windowsOut,   1, 7, default, popin 80%
    animation = border,       1, 10, default
    animation = borderangle,  1, 8,  default
    animation = fade,         1, 7,  default
    animation = workspaces,   1, 6,  default
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

render {
    # 2 = try direct‑scanout, fall back if unsupported
    direct_scanout = 2
}

xwayland {
    force_zero_scaling = true
}

input {
    kb_layout = es
    accel_profile = flat
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

# ------------------------------------------------------------

# Lightweight autostart (prefer systemd‑user for daemons)

# ------------------------------------------------------------

# Here we keep only compositor‑dependent one‑shots.

exec-once = uwsm app -- hypridle
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- hyprlock
exec-once = uwsm app -- dunst
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
exec-once = brightnessctl --device=amdgpu_bl1 s `brightnessctl --device=amdgpu_bl1 g`
exec-once = uwsm app -- wl-paste --type text --watch cliphist store # Stores only text data
exec-once = uwsm app -- wl-paste --type image --watch cliphist store # Stores only image data

# ------------------------------------------------------------
