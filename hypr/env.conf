# GPU switching:   switch-gpu.sh → writes the desired card to this file

env = WLR_DRM_DEVICES,$HOME/.config/hypr/gpu

# Common desktop vars

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,true
env = XDG_DATA_DIRS,$XDG_DATA_DIRS:/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

# NVIDIA‑only overrides are injected by /etc/profile.d/nvidia-hyprland.sh

# when the nvidia‑modules are loaded.
